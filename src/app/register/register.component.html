<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-blue-900 to-blue-300 text-black px-4 py-6 sm:px-6">
  <!-- Back Arrow -->
  <a [routerLink]="['/']" class="mb-6 self-start">
    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
  </a>

  <!-- Create Account Text -->
  <h1 class="text-4xl font-bold mb-8">Create an account</h1>

  <!-- Input Fields -->
  <div class="space-y-4 mb-6 w-full max-w-xs">
    <!-- First Name -->
    <div class="relative">
      <input type="text" placeholder="First Name" [(ngModel)]="firstName" name="firstName" class="w-full py-3 pl-10 pr-4 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </div>
    <!-- Last Name -->
    <div class="relative">
      <input type="text" placeholder="Last Name" [(ngModel)]="lastName" name="lastName" class="w-full py-3 pl-10 pr-4 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </div>
    <!-- Email -->
    <div class="relative">
      <input type="text" placeholder="Username or Email" [(ngModel)]="email" name="email" class="w-full py-3 pl-10 pr-4 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </div>
    <!-- Password -->
    <div class="relative">
      <input type="password" placeholder="Password" [(ngModel)]="password" name="password" class="w-full py-3 pl-10 pr-12 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c1.104 0 2-.896 2-2s-.896-2-2-2-2 .896-2 2 .896 2 2 2zm0 2c-1.104 0-2 .896-2 2v3h4v-3c0-1.104-.896-2-2-2zm-6 2v3h2v-3c0-1.104-.896-2-2-2s-2 .896-2 2zm12 0c-1.104 0-2 .896-2 2v3h4v-3c0-1.104-.896-2-2-2z"></path>
      </svg>
    </div>
    <!-- Confirm Password -->
    <div class="relative">
      <input type="password" placeholder="Confirm Password" [(ngModel)]="confirmPassword" name="confirmPassword" class="w-full py-3 pl-10 pr-12 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c1.104 0 2-.896 2-2s-.896-2-2-2-2 .896-2 2 .896 2 2 2zm0 2c-1.104 0-2 .896-2 2v3h4v-3c0-1.104-.896-2-2-2zm-6 2v3h2v-3c0-1.104-.896-2-2-2s-2 .896-2 2zm12 0c-1.104 0-2 .896-2 2v3h4v-3c0-1.104-.896-2-2-2z"></path>
      </svg>
    </div>
  </div>

  <!-- Create Account Button -->
  <button (click)="onRegister()" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-full mb-6 w-full max-w-xs text-center">Create Account</button>

  <!-- Social Login Divider -->
  <div class="flex items-center mb-6 w-full max-w-xs">
    <div class="flex-grow border-t border-gray-400"></div>
    <span class="mx-4 text-sm text-gray-700">Or Continue with</span>
    <div class="flex-grow border-t border-gray-400"></div>
  </div>

  <!-- Social Login Buttons -->
  <div class="flex justify-center space-x-4 mb-6 w-full max-w-xs">
    <button class="bg-white p-3 rounded-lg flex-1">
      <!-- Add Social Login Icons here -->
    </button>
  </div>

  <!-- Login Link -->
  <p class="text-center text-sm w-full max-w-xs">
    I Already Have an Account <a [routerLink]="['/login']" class="text-blue-500 underline">Login</a>
  </p>
</div>
