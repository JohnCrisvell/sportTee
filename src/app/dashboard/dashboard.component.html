<main class="min-h-screen bg-gradient-to-b from-blue-900 to-blue-300 text-gray-800">
  <div class="container max-w-6xl mx-auto px-4 py-6">
    <!-- Top Navbar -->
    <nav class="bg-blue-700 p-4 rounded-lg shadow-md flex justify-between items-center text-white">
      <button aria-label="Open menu" class="focus:outline-none hover:bg-blue-800 p-2 rounded">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 sm:w-10 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span class="text-white font-bold text-base sm:text-lg">{{ firstName || 'Guest' }}</span>
      </div>
    </nav>

    <!-- Banner Image -->
    <div class="mt-6">
      <img src="assets/banner.jpg" alt="Promotional banner for sports products" class="w-full h-48 object-cover rounded-lg shadow-md" />
    </div>

    <!-- Search Bar -->
    <div class="mt-6">
      <div class="relative">
        <input
          type="text"
          placeholder="Search any Product..."
          class="w-full pl-10 pr-4 py-3 rounded-full bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-600 text-base shadow-sm"
          [(ngModel)]="searchTerm"
          (ngModelChange)="filterProducts()"
        />
        <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M9.5 17a7.5 7.5 0 100-15 7.5 7.5 0 000 15z" />
        </svg>
      </div>
    </div>

    <!-- Featured Header -->
    <div class="flex justify-between items-center mt-6">
      <h2 class="text-blue-700 font-semibold text-xl">All Featured</h2>
      <div class="flex gap-3">
        <button class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm hover:bg-blue-700 transition">Sort</button>
        <button class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm flex items-center gap-2 hover:bg-blue-700 transition">
          Filter
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L15 14.414V19a1 1 0 01-.553.894l-4 2A1 1 0 019 21v-6.586L3.293 6.707A1 1 0 013 6V4z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Category Scroll -->
    <div class="overflow-x-auto whitespace-nowrap mt-6">
      <div class="flex gap-6">
        <div *ngFor="let category of categories" class="text-center min-w-[100px]">
          <img
            [src]="category.image"
            [alt]="category.name + ' category'"
            class="w-20 h-20 rounded-full mx-auto object-cover cursor-pointer hover:ring-2 hover:ring-blue-600 transition"
            (click)="filterByCategory(category.name)"
          />
          <p class="text-sm mt-2 text-gray-700">{{ category.name }}</p>
        </div>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="grid grid-cols-3 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4 mt-8 pb-20">
      <div *ngFor="let product of filteredProducts" class="bg-white shadow-lg rounded-lg p-2 sm:p-3 hover:shadow-xl transition">
        <img [src]="product.image" [alt]="product.name" class="w-full h-20 sm:h-40 object-cover rounded-md cursor-pointer" (click)="viewProduct(product)" onerror="this.src='assets/fallback.jpg'" />
        <p class="text-sm mt-2 text-gray-700">{{ product.name }}</p>
        <p class="text-green-600 font-semibold mt-1">₱{{ product.price }}</p>
        <div class="flex justify-center mt-2">
          <span class="text-yellow-400 text-sm">★★★★☆</span>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg flex justify-around py-3 text-sm text-gray-600 max-w-6xl mx-auto animate-slide-up">
      <div class="flex flex-col items-center text-red-500 cursor-pointer transform transition duration-300 hover:scale-110 hover:text-blue-700" (click)="navigateToDashboard()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span>Home</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer transform transition duration-300 hover:scale-110 hover:text-blue-700" (click)="navigateTo('wishlist')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"></path>
        </svg>
        <span>Wishlist</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer transform transition duration-300 hover:scale-110 hover:text-blue-700" (click)="navigateTo('checkout')">
        <div class="relative">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
          <span class="absolute -top-1 -right-2 bg-red-500 text-xs rounded-full px-1.5 py-0.5">1</span>
        </div>
        <span>Cart</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer transform transition duration-300 hover:scale-110 hover:text-blue-700" (click)="navigateTo('search')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1016.65 16.65z"></path>
        </svg>
        <span>Search</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer transform transition duration-300 hover:scale-110 hover:text-blue-700" (click)="navigateTo('profile')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span>Profile</span>
      </div>
    </nav>
  </div>

  <!-- Modal Overlay -->
  <div *ngIf="selectedProduct" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-4 py-8 overflow-y-auto" (click)="closeModal()">
    <div class="bg-white rounded-lg shadow-lg p-4 sm:p-6 max-w-[90vw] sm:max-w-md w-full relative" (click)="$event.stopPropagation()">
      <!-- Close Button -->
      <button class="absolute top-2 right-2 text-gray-600 hover:text-gray-800" (click)="closeModal()" aria-label="Close modal">
        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
      <!-- Product Image -->
      <img [src]="selectedProduct.image" [alt]="selectedProduct.name" class="w-full h-48 sm:h-64 object-cover rounded-md mb-4" onerror="this.src='assets/fallback.jpg'" />
      <!-- Product Name -->
      <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-2">{{ selectedProduct.name }}</h2>
      <!-- Product Price -->
      <p class="text-green-600 font-semibold text-lg sm:text-xl mb-2">₱{{ selectedProduct.price }}</p>
      <!-- Product Category -->
      <p class="text-gray-600 text-sm sm:text-base mb-2">Category: {{ selectedProduct.category }}</p>
      <!-- Product Description -->
      <p class="text-gray-700 text-sm sm:text-base mb-4">{{ selectedProduct.description }}</p>
      <!-- Add to Cart Button -->
      <button (click)="addToCart(selectedProduct)" class="bg-green-600 text-white px-4 py-2 rounded-full hover:bg-green-700 transition w-full text-sm sm:text-base">
        Add to Cart
      </button>
    </div>
  </div>
</main>
